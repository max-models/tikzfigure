name: Testing

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

defaults:
  run:
    shell: bash

jobs:
  test-code:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/max-models/tikzpics/texlive-quarto:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Cache pip dependencies
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # - name: Install TeX Live with pdflatex
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y texlive-full
      # sudo apt-get install -y texlive texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science

      - name: Check if pdflatex is available
        run: |
          which pdflatex
          pdflatex --version

      # Create virtual environment and install project from pyproject.toml
      - name: Set up virtual environment and install project
        run: |
          python -m venv env
          source env/bin/activate
          pip install --upgrade pip
          pip install ".[dev]"

      # Run tests, including the ones that compile with pdflatex
      - name: Run tests
        run: |
          source env/bin/activate
          coverage run -m pytest . -v -m "not network"
          coverage report
        env:
          CI: true

      # - name: Test Quarto tutorials
      #   run: |
      #     source env/bin/activate
      #     for qmd in tutorials/*.qmd; do
      #       quarto render "$qmd" --to gfm --output-dir /tmp/quarto-test
      #     done

      # - name: Test Jupyter notebook tutorials
      #   run: |
      #     source env/bin/activate
      #     for ipynb in tutorials/*.ipynb; do
      #       jupyter nbconvert --to notebook --execute "$ipynb" --output /tmp/nbconvert-test.ipynb
      #     done

  # The container job above pins one interpreter so it can use the TeX Live
  # image. This job covers the supported Python versions and platforms
  # instead, skipping the tests that need a local pdflatex.
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,vis]"

      - name: Run tests
        run: pytest -v -m "not network and not latex"
        env:
          CI: true

  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the package
        run: python -m build
