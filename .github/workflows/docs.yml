name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel. The notebooks compile their
# figures with pdflatex, hence the TeX Live packages.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.6.0
    with:
      apt-packages: texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-science texlive-fonts-recommended
      smoke-paths: |
        installation/index.html
        editor/index.html
        tutorials/tutorial-01-getting-started/index.html
        tutorials/tutorial-26-gantt/index.html
        api/tikzfigure/index.html
