[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "tikzfigure"
version = "0.3.1"
description = "Python interface to generate (readable) Tikz figures."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typing_extensions>=4.0; python_version < '3.11'",
]

optional-dependencies.dev = [
  "pyyaml",
  "black[jupyter]",
  "isort",
  "pre-commit",
  "pyproject-fmt",
  "ruff",
  "tikzfigure[docs]",
  "tikzfigure[test]",
  "tikzfigure[vis]",
]

optional-dependencies.vis = [
  "matplotlib",
  "jupyterlab",
  "pymupdf",
  "requests",
]

optional-dependencies.docs = [
  "ipykernel",
  "mkdocs-material",
  "mkdocs-jupyter",
  "mkdocstrings[python]",
  "nbconvert",
  "numpy",
  "pydoc-markdown",
  "scipy",
  "tikzfigure[vis]",
]
optional-dependencies.test = [
  "coverage",
  "pytest",
  "types-requests",
  "mypy",
]
urls."Source" = "https://github.com/max-models/tikzfigure"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
tikzfigure = [ "py.typed" ]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["src/tikzfigure/tests"]

# Modules that are fully annotated. New modules should be added here; the
# long-term goal is to enable `disallow_untyped_defs` globally.
[[tool.mypy.overrides]]
module = [
  "tikzfigure.core.style_options",
  "tikzfigure.core.web_compiler",
  "tikzfigure.options",
  "tikzfigure.arrows",
  "tikzfigure.decorations",
  "tikzfigure.marks",
  "tikzfigure.patterns",
  "tikzfigure.shapes",
  "tikzfigure.styles",
  "tikzfigure.units",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
source = [ "tikzfigure" ]
omit = [ "*/tikzfigure/tests/*" ]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.isort]
profile = "black"
