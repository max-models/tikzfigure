[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "tikzfigure"
version = "0.5.0"
description = "Python interface to generate (readable) Tikz figures."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typing_extensions>=4.0; python_version < '3.11'",
]

optional-dependencies.dev = [
  "pyyaml",
  "pre-commit",
  "pyproject-fmt",
  "ruff",
  "tikzfigure[docs]",
  "tikzfigure[test]",
  "tikzfigure[vis]",
]

optional-dependencies.vis = [
  "matplotlib",
  "jupyterlab",
  "pymupdf",
  "requests",
]

optional-dependencies.docs = [
  "ipykernel",
  "mkdocs-material",
  "mkdocs-jupyter",
  "mkdocstrings[python]",
  "nbconvert",
  "numpy",
  "pydoc-markdown",
  "scipy",
  "tikzfigure[vis]",
]
optional-dependencies.test = [
  "coverage",
  "pytest",
]
urls."Source" = "https://github.com/max-models/tikzfigure"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
tikzfigure = [ "py.typed" ]

[tool.coverage.run]
source = [ "tikzfigure" ]
omit = [ "*/tikzfigure/tests/*" ]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 88
# formatting: `ruff format`; import sorting: the isort rules of `ruff check`
# an explicit rule set: ruff's default one grows between releases
lint.select = [ "E4", "E7", "E9", "F", "I" ]
# the package namespace re-exports the pyplot-style API
lint.per-file-ignores."src/tikzfigure/__init__.py" = [ "F403" ]
# tests skip on missing extras before importing, and build figures only for the side effect
lint.per-file-ignores."src/tikzfigure/tests/*" = [ "E402", "F841" ]
lint.per-file-ignores."tutorials/**" = [ "E402", "E731" ]
